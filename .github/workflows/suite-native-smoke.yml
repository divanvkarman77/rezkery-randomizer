name: Suite Android smoke
on:
  pull_request:
    paths: ['android/**', 'suite/**', '.github/workflows/suite-native-smoke.yml']
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug assembleDebugAndroidTest
        working-directory: android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell am instrument -w com.rezkery.randomizer.suite.test/com.rezkery.randomizer.SuiteSmokeInstrumentation | tee native-smoke.txt
            grep -q SUITE_SMOKE_OK native-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-native-smoke-result
          path: native-smoke.txt
